<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="איידיר כרטיסים">
  <defs>
    <linearGradient id="idirMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d1f4b"/>
      <stop offset="0.55" stop-color="#a63a63"/>
      <stop offset="1" stop-color="#bf9b48"/>
    </linearGradient>
  </defs>

  <!-- סמל (badge) בצד ימין -->
  <rect x="242" y="6" width="52" height="52" rx="14" fill="url(#idirMark)"/>
  <!-- אייקון כרטיס -->
  <rect x="254" y="22" width="28" height="19" rx="5" fill="#ffffff"/>
  <line x1="275" y1="24" x2="275" y2="39" stroke="#bf9b48" stroke-width="2" stroke-dasharray="2 2"/>
  <circle cx="254" cy="31.5" r="2.6" fill="url(#idirMark)"/>
  <circle cx="282" cy="31.5" r="2.6" fill="url(#idirMark)"/>

  <!-- טקסט המותג, מיושר לימין משמאל לסמל -->
  <text x="228" y="34" text-anchor="end"
        font-family="Heebo, Assistant, Arial, 'Segoe UI', sans-serif"
        font-size="26" font-weight="800" fill="#1b1420">איידיר כרטיסים</text>
  <text x="228" y="52" text-anchor="end"
        font-family="Arial, 'Segoe UI', sans-serif"
        font-size="11" font-weight="700" letter-spacing="3.5" fill="#a07f2e">IDIR TICKETS</text>
</svg>
